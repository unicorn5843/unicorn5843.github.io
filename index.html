<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squishies for you</title>
<meta name="description" content="Squishies for you: a squishy toy shop.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%84%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B1B4E;
  --ink-soft:#5A4880;
  --mist:#F4EEFF;
  --white:#FFFFFF;
  --pink:#FF5FA2;
  --lagoon:#25C2D6;
  --lemon:#FFD84D;
  --lime:#86E05A;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--mist);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;letter-spacing:-0.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px;border-radius:12px}
.wrap{width:min(1100px,100% - 32px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--mist);border-bottom:3px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding:10px 0}
.logo{
  font-family:var(--display);font-weight:800;font-size:1.35rem;text-decoration:none;
  background:var(--pink);color:var(--ink);padding:4px 18px 6px;
  border:3px solid var(--ink);border-radius:60% 40% 55% 45% / 55% 60% 40% 45%;
  white-space:nowrap;
}
nav{margin-left:auto;display:flex;align-items:center;gap:6px}
nav a{
  text-decoration:none;font-weight:800;padding:8px 14px;border-radius:999px;
}
nav a:hover{background:var(--lemon)}
nav a[aria-current="page"]{background:var(--ink);color:var(--white)}
.bag{
  position:relative;display:inline-flex;align-items:center;gap:8px;
  background:var(--lemon);border:3px solid var(--ink);border-radius:999px;
  padding:6px 16px;font-weight:800;text-decoration:none;
}
.bag svg{width:22px;height:22px}
.bag .count{
  min-width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--white);
  display:grid;place-items:center;font-size:.9rem;padding:0 4px;
}
.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25,.8)}60%{transform:scale(.9,1.15)}100%{transform:scale(1)}}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--display);font-weight:800;font-size:1.1rem;
  padding:10px 26px 12px;border:3px solid var(--ink);border-radius:999px;
  background:var(--pink);color:var(--ink);text-decoration:none;
  box-shadow:0 5px 0 var(--ink);transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(4px) scale(1.06,.9);box-shadow:0 1px 0 var(--ink)}
.btn.dark{background:var(--ink);color:var(--white);box-shadow:0 5px 0 var(--pink)}
.btn.dark:active{box-shadow:0 1px 0 var(--pink)}
.btn.light{background:var(--white)}
.btn.small{font-size:1rem;padding:7px 18px 9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- Hero ---------- */
.hero{padding:40px 0 56px;overflow:hidden}
.hero .wrap{display:grid;gap:32px;align-items:center}
@media(min-width:800px){.hero .wrap{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(3rem,10vw,5.6rem)}
.hero p.lead{font-size:1.25rem;margin:18px 0 26px;max-width:30ch;color:var(--ink-soft);font-weight:700}
.hero .actions{display:flex;flex-wrap:wrap;gap:14px}
.jelly-stage{position:relative;width:min(88vw,420px);aspect-ratio:1;margin-inline:auto}
.jelly-stage .dot{position:absolute;border:3px solid var(--ink)}
.dot.a{width:34%;height:34%;background:var(--lemon);top:-4%;right:-6%;border-radius:50% 50% 45% 55%/60% 40% 60% 40%}
.dot.b{width:26%;height:26%;background:var(--lime);bottom:2%;left:-6%;border-radius:40% 60% 50% 50%/50% 50% 50% 50%}
.dot.c{width:14%;height:14%;background:var(--pink);top:14%;left:-2%;border-radius:50%}
.jelly{
  position:absolute;inset:0;border:4px solid var(--ink);background:var(--white);overflow:hidden;
  border-radius:58% 42% 55% 45% / 48% 56% 44% 52%;padding:0;
  box-shadow:10px 10px 0 var(--ink);
  transform-origin:50% 100%;
}
.jelly img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.jelly.go{animation:jelly .75s}
@keyframes jelly{
  0%{transform:scale(1)}
  18%{transform:scale(1.22,.7)}
  40%{transform:scale(.86,1.16)}
  60%{transform:scale(1.08,.94)}
  80%{transform:scale(.97,1.03)}
  100%{transform:scale(1)}
}
.hint{
  position:absolute;left:50%;bottom:-18px;transform:translateX(-50%) rotate(-3deg);
  background:var(--lemon);border:3px solid var(--ink);border-radius:999px;
  padding:4px 18px 6px;font-family:var(--display);font-weight:800;white-space:nowrap;
}

/* ---------- Sections ---------- */
section.block{padding:48px 0}
.block h2{font-size:clamp(2rem,6vw,3rem)}
.block .sub{color:var(--ink-soft);font-weight:700;margin-top:8px}
.band{background:var(--ink);color:var(--white)}
.band .sub{color:#D9CCF5}
.row-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:26px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:24px}}

.card{
  background:var(--tint,#fff);border:3px solid var(--ink);border-radius:30px 30px 30px 30px;
  padding:12px 12px 16px;display:flex;flex-direction:column;gap:12px;
  box-shadow:6px 6px 0 var(--ink);
}
.card .pic{
  display:block;width:100%;aspect-ratio:1;border:3px solid var(--ink);overflow:hidden;background:#fff;padding:0;
  border-radius:var(--blob,50% 50% 46% 54% / 50% 46% 54% 50%);
  transition:transform .15s;
}
.card .pic:active{transform:scale(1.06,.9)}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card:nth-child(2n) .pic{--blob:42% 58% 50% 50% / 56% 44% 56% 44%}
.card:nth-child(3n) .pic{--blob:56% 44% 40% 60% / 48% 56% 44% 52%}
.card h3{font-size:1.25rem;padding:0 4px}
.card .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px;margin-top:auto}
.price{
  font-family:var(--display);font-weight:800;font-size:1.3rem;
  background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:0 14px 2px;
}
.card .btn{width:100%}

/* steps (a real sequence) */
.steps{display:grid;gap:18px;margin-top:28px;counter-reset:s}
@media(min-width:700px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--white);color:var(--ink);border:3px solid var(--pink);border-radius:26px;padding:20px 22px}
.step::before{
  counter-increment:s;content:counter(s);display:grid;place-items:center;
  width:44px;height:44px;border-radius:50%;background:var(--lemon);border:3px solid var(--ink);
  font-family:var(--display);font-weight:800;font-size:1.3rem;margin-bottom:10px;
}
.step h3{font-size:1.4rem;margin-bottom:4px}

/* ---------- Detail ---------- */
.crumb{display:inline-block;margin:24px 0 0;font-weight:800;text-decoration:none;padding:6px 14px;border-radius:999px;border:3px solid var(--ink);background:var(--white)}
.crumb:hover{background:var(--lemon)}
.detail{display:grid;gap:28px;padding:28px 0 40px}
@media(min-width:800px){.detail{grid-template-columns:1fr 1fr;align-items:start}}
.detail .big{
  border:4px solid var(--ink);overflow:hidden;background:#fff;aspect-ratio:1;width:100%;
  border-radius:52% 48% 46% 54% / 50% 54% 46% 50%;box-shadow:10px 10px 0 var(--ink);padding:0;
  transform-origin:50% 100%;
}
.detail .big img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.detail .big.go{animation:jelly .75s}
.detail h1{font-size:clamp(2.4rem,7vw,3.6rem)}
.detail .price{display:inline-block;font-size:1.8rem;margin:14px 0}
.detail p.desc{font-size:1.15rem;max-width:44ch}
.facts{list-style:none;padding:0;margin:18px 0;display:grid;gap:8px}
.facts li{display:flex;gap:10px;align-items:center;font-weight:700}
.facts li::before{content:"";width:16px;height:16px;border:3px solid var(--ink);border-radius:50%;background:var(--tint,var(--lemon));flex:none}
.level{display:flex;align-items:center;gap:10px;font-weight:800;margin:6px 0 22px}
.level i{width:26px;height:26px;border:3px solid var(--ink);border-radius:50%;background:var(--white)}
.level i.on{background:var(--pink)}
.detail .actions{display:flex;flex-wrap:wrap;gap:14px}

/* ---------- Basket / checkout ---------- */
.page{padding:36px 0 60px}
.page h1{font-size:clamp(2.4rem,7vw,3.6rem);margin-bottom:24px}
.lines{display:grid;gap:14px}
.line{
  display:grid;grid-template-columns:76px 1fr;gap:6px 14px;align-items:center;
  background:var(--white);border:3px solid var(--ink);border-radius:26px;padding:12px;
}
.line img{width:76px;height:76px;object-fit:cover;border:3px solid var(--ink);border-radius:50% 50% 44% 56% / 50% 44% 56% 50%;grid-row:span 2}
.line h3{font-size:1.2rem}
.line .ctl{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px}
.stepper{display:inline-flex;align-items:center;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--mist)}
.stepper button{width:38px;height:36px;border:0;background:transparent;font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1}
.stepper button:hover{background:var(--lemon)}
.stepper button:active{background:var(--pink)}
.stepper span{min-width:30px;text-align:center;font-weight:800}
.line .sum{margin-left:auto;font-family:var(--display);font-weight:800;font-size:1.25rem}
.linkbtn{background:none;border:0;text-decoration:underline;font-weight:800;padding:4px}
.totalbox{
  margin-top:24px;background:var(--lemon);border:3px solid var(--ink);border-radius:30px;padding:20px 22px;
  box-shadow:6px 6px 0 var(--ink);display:grid;gap:10px;
}
.totalbox .r{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.totalbox .r.t{font-family:var(--display);font-weight:800;font-size:1.8rem;border-top:3px dashed var(--ink);padding-top:10px;margin-top:4px}
.empty{
  text-align:center;background:var(--white);border:3px dashed var(--ink);border-radius:40px;padding:44px 20px;
}
.empty h2{font-size:2rem;margin-bottom:8px}
.empty p{margin-bottom:22px;color:var(--ink-soft);font-weight:700}

.checkout{display:grid;gap:28px}
@media(min-width:850px){.checkout{grid-template-columns:1.1fr .9fr;align-items:start}}
fieldset{border:3px solid var(--ink);border-radius:26px;background:var(--white);padding:16px 20px 20px;margin:0 0 20px}
legend{font-family:var(--display);font-weight:800;font-size:1.3rem;padding:0 10px;background:var(--white)}
label{display:block;font-weight:800;margin-bottom:6px}
input[type=text]{
  width:100%;font:inherit;padding:12px 16px;border:3px solid var(--ink);border-radius:18px;background:var(--mist);color:var(--ink);
}
.choice{
  display:flex;gap:12px;align-items:flex-start;border:3px solid var(--ink);border-radius:20px;padding:12px 14px;margin-bottom:10px;background:var(--mist);cursor:pointer;
}
.choice:has(input:checked){background:var(--lemon)}
.choice input{margin-top:6px;accent-color:var(--ink);width:20px;height:20px}
.choice b{display:block}
.choice small{display:block;color:var(--ink-soft);font-weight:700;font-size:.95rem}
.mini{display:grid;gap:10px;margin-bottom:6px}
.mini .m{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.mini .m span:first-child{display:flex;gap:10px;align-items:center}
.mini img{width:44px;height:44px;object-fit:cover;border:2px solid var(--ink);border-radius:50%}
.note{font-weight:700;color:var(--ink-soft);font-size:.95rem;margin-top:12px}

/* thanks */
.thanks{text-align:center;position:relative;overflow:hidden}
.thanks h1{margin-bottom:10px}
.receipt{
  text-align:left;max-width:520px;margin:28px auto 26px;background:var(--white);
  border:3px solid var(--ink);border-radius:26px;padding:20px 22px;box-shadow:6px 6px 0 var(--ink);
}
.receipt h2{font-size:1.4rem;margin-bottom:10px}
.receipt .r{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-weight:700;border-bottom:2px dashed #cdbfee}
.receipt .r.t{border:0;font-family:var(--display);font-weight:800;font-size:1.5rem;padding-top:12px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{
  position:absolute;top:-40px;width:18px;height:18px;border:2px solid var(--ink);
  border-radius:50% 40% 55% 45%;animation:fall 2.8s ease-in forwards;
}
@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100% - 24px);
  bottom:22px;transform:translateY(160%);z-index:40;visibility:hidden;
  background:var(--ink);color:var(--white);border-radius:999px;padding:10px 12px 10px 22px;
  display:flex;align-items:center;gap:14px;font-weight:800;
  border:3px solid var(--white);box-shadow:0 0 0 3px var(--ink);
  transition:transform .35s cubic-bezier(.3,1.5,.5,1), visibility 0s .35s;
}
.toast.show{transform:translateY(0);visibility:visible;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.toast a{background:var(--lemon);color:var(--ink);border-radius:999px;padding:4px 14px;text-decoration:none;white-space:nowrap}

footer{border-top:3px solid var(--ink);background:var(--lemon);padding:28px 0 36px;margin-top:20px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;font-weight:800}
footer .fine{font-weight:700;max-width:52ch}

@media(max-width:520px){
  body{font-size:16px}
  .logo{font-size:1.05rem;padding:3px 12px 5px}
  nav a.nl{padding:6px 10px}
  nav a[data-nav="home"]{display:none}
  .top .wrap{gap:8px}
  .bag{padding:5px 12px}
  .bag .label{display:none}
  .line .sum{margin-left:0}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#/">Squishies for you</a>
    <nav aria-label="Main">
      <a class="nl" href="#/" data-nav="home">Home</a>
      <a class="nl" href="#/shop" data-nav="shop">Shop</a>
      <a class="bag" href="#/basket" aria-label="Basket" data-nav="basket">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="label">Basket</span>
        <span class="count" id="count">0</span>
      </a>
    </nav>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer>
  <div class="wrap">
    <span>Squishies for you</span>
    <span class="fine">This is a shop for children.</span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><a href="#/basket">View basket</a></div>

    id:"fruit-squish-ball", name:"Fruit Squish Ball", price:6.49, img:IMG.fruit, tint:"#FFE9A8", level:5,
    short:"Strawberry, orange and kiwi in a clear ball.",
    desc:"A clear squishy ball with juicy fruit slices floating inside. It looks good enough to eat, but it's only for squishing! Squeeze it and the fruit slides around.",
    facts:["Strawberry, orange and kiwi","Clear and wobbly","Super squeezy"],
    alt:"A clear squishy ball with fruit pieces inside"
  },
  {
    id:"jelly-squish-jellyfish", name:"Jelly Squish Jellyfish", price:8.50, img:IMG.jellyfish, tint:"#C8F5E4", level:4,
    short:"A sea-green jellyfish with long, wobbly tentacles.",
    desc:"A dreamy jellyfish in shimmery sea green. Hold the top and let the tentacles dangle, then give the head a gentle squish and watch it bounce.",
    facts:["Long wobbly tentacles","Sea-green and shimmery","Gentle and squashy"],
    alt:"A sea-green jellyfish squishy toy shown on its box"
  },
  {
    id:"sugar-splat", name:"Sugar Splat", price:9.99, img:IMG.splat, tint:"#FFD3E6", level:5,
    short:"A big, bouncy splat that's super squishy.",
    desc:"A deep ocean-blue splat with lots of wiggly arms. Press it flat, pull its arms and let go. It splats right back into its shape every time.",
    facts:["The biggest squish in the shop","Wiggly splat arms","Ocean blue"],
    alt:"A blue splat shaped squishy toy in its box"
  },
  {
    id:"squishy-soap", name:"Squishy Soap", price:5.49, img:IMG.soap, tint:"#FFD9EC", level:4,
    short:"A soft bar that looks just like real soap.",
    desc:"A big, soft squishy bar that looks just like a real bar of soap, with the word SOAP pressed into the top. It comes in pink, blue and white. Give it a squeeze, but don't try to wash with it!",
    facts:["Pink, blue and white bars","Soft and squashy","Comes in its own box"],
    alt:"A pink squishy soap bar held in a hand, with blue, white and pink bars behind it"
  },
  {
    id:"strawberry-duck", name:"Strawberry Duck", price:6.99, img:IMG.duck, tint:"#FFD1CC", level:3,
    short:"A rubber duck dressed up as a strawberry.",
    desc:"Part fruit, part duck and totally squishy. This cheeky red duck wears a leafy green strawberry hat and has a bright yellow beak.",
    facts:["Leafy green hat","Bright yellow beak","Soft and bumpy"],
    alt:"A red duck toy with a green strawberry top"
  }
];
const byId = Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
const money = n => "£" + n.toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Basket (remembered on this device when possible) ---------- */
let cart = {};
try { cart = JSON.parse(localStorage.getItem("squishCart") || "{}") || {}; } catch(e){ cart = {}; }
Object.keys(cart).forEach(k => { if(!byId[k] || !(cart[k] > 0)) delete cart[k]; });
function saveCart(){ try { localStorage.setItem("squishCart", JSON.stringify(cart)); } catch(e){} }
const cartCount = () => Object.values(cart).reduce((a,b)=>a+b,0);
const cartTotal = () => Object.entries(cart).reduce((a,[id,q]) => a + byId[id].price*q, 0);
let lastOrder = null;

function updateBadge(bump){
  const c = document.getElementById("count");
  c.textContent = cartCount();
  if(bump){ c.parentElement.classList.remove("bump"); void c.offsetWidth; c.parentElement.classList.add("bump"); }
}
let toastTimer;
function toast(msg){
  document.getElementById("toastText").textContent = msg;
  const t = document.getElementById("toast");
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}
function addToCart(id){
  cart[id] = (cart[id]||0) + 1; saveCart(); updateBadge(true);
  toast("Added " + byId[id].name + " to your basket");
}

/* ---------- Views ---------- */
function card(p){
  return `<article class="card" style="--tint:${p.tint}">
    <button class="pic" data-open="${p.id}" aria-label="See ${esc(p.name)} up close"><img src="${p.img}" alt="${esc(p.alt)}"></button>
    <h3>${esc(p.name)}</h3>
    <div class="meta"><span class="price">${money(p.price)}</span></div>
    <button class="btn small" data-add="${p.id}">Add to basket</button>
  </article>`;
}

function viewHome(){
  const feat = ["sugar-unicorn","strawberry-duck","fruit-squish-ball"].map(id=>byId[id]);
  return `
  <section class="hero"><div class="wrap">
    <div>
      <h1>Squishies for you</h1>
      <p class="lead">Pick your favourite squishy, pop it in the basket and check out.</p>
      <div class="actions">
        <a class="btn" href="#/shop">Start shopping</a>
        <a class="btn light" href="#/basket">See my basket</a>
      </div>
    </div>
    <div class="jelly-stage">
      <span class="dot a"></span><span class="dot b"></span><span class="dot c"></span>
      <button class="jelly" id="jelly" aria-label="Squish the unicorn"><img src="${IMG.unicorn}" alt="A glittery blue unicorn squishy"></button>
      <span class="hint">Give it a squish!</span>
    </div>
  </div></section>

  <section class="block"><div class="wrap">
    <div class="row-head">
      <div><h2>Squishy favourites</h2><p class="sub">Tap a picture to see it up close.</p></div>
      <a class="btn small light" href="#/shop">See all squishies</a>
    </div>
    <div class="grid">${feat.map(card).join("")}</div>
  </div></section>

  <section class="block band"><div class="wrap">
    <h2>How to shop</h2>
    <p class="sub">Three easy steps.</p>
    <div class="steps">
      <div class="step"><h3>Choose</h3><p>Look at all the squishies and tap one to read about it.</p></div>
      <div class="step"><h3>Add to basket</h3><p>Press the pink button to put it in your basket.</p></div>
      <div class="step"><h3>Check out</h3><p>Open your basket, check your list and total, then place your order.</p></div>
    </div>
  </div></section>`;
}

function viewShop(){
  return `<section class="page"><div class="wrap">
    <h1>All the squishies</h1>
    <div class="grid">${PRODUCTS.map(card).join("")}</div>
  </div></section>`;
}

function viewItem(id){
  const p = byId[id];
  if(!p) return viewShop();
  const dots = [1,2,3,4,5].map(i=>`<i class="${i<=p.level?"on":""}"></i>`).join("");
  const more = PRODUCTS.filter(x=>x.id!==id).slice(0,3);
  return `<section class="wrap">
    <a class="crumb" href="#/shop">Back to all squishies</a>
    <div class="detail" style="--tint:${p.tint}">
      <button class="big" id="bigpic" aria-label="Squish the picture"><img src="${p.img}" alt="${esc(p.alt)}"></button>
      <div>
        <h1>${esc(p.name)}</h1>
        <span class="price">${money(p.price)}</span>
        <p class="desc">${esc(p.desc)}</p>
        <ul class="facts">${p.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
        <div class="level" aria-label="Squish level ${p.level} out of 5"><span>Squish level</span>${dots}</div>
        <div class="actions">
          <button class="btn" data-add="${p.id}">Add to basket</button>
          <a class="btn light" href="#/basket">Go to basket</a>
        </div>
      </div>
    </div>
  </section>
  <section class="block"><div class="wrap">
    <h2>You might also like</h2>
    <div class="grid" style="margin-top:22px">${more.map(card).join("")}</div>
  </div></section>`;
}

function viewBasket(){
  const ids = Object.keys(cart);
  if(!ids.length){
    return `<section class="page"><div class="wrap">
      <h1>Your basket</h1>
      <div class="empty"><h2>Nothing here yet</h2><p>Pick a squishy and add it to your basket.</p><a class="btn" href="#/shop">Go to the shop</a></div>
    </div></section>`;
  }
  const lines = ids.map(id=>{
    const p = byId[id], q = cart[id];
    return `<div class="line">
      <img src="${p.img}" alt="">
      <div><h3>${esc(p.name)}</h3><span>${money(p.price)} each</span></div>
      <div class="ctl">
        <div class="stepper">
          <button data-dec="${id}" aria-label="One less ${esc(p.name)}">−</button>
          <span aria-live="polite">${q}</span>
          <button data-inc="${id}" aria-label="One more ${esc(p.name)}">+</button>
        </div>
        <button class="linkbtn" data-remove="${id}">Remove</button>
        <span class="sum">${money(p.price*q)}</span>
      </div>
    </div>`;
  }).join("");
  const n = cartCount();
  return `<section class="page"><div class="wrap">
    <h1>Your basket</h1>
    <div class="lines">${lines}</div>
    <div class="totalbox">
      <div class="r"><span>${n} ${n===1?"item":"items"}</span><span>${money(cartTotal())}</span></div>
      <div class="r"><span>Delivery</span><span>Free</span></div>
      <div class="r t"><span>Total</span><span>${money(cartTotal())}</span></div>
      <a class="btn dark block" href="#/checkout">Go to checkout</a>
    </div>
    <p style="margin-top:20px"><a href="#/shop" style="font-weight:800">Keep shopping</a></p>
  </div></section>`;
}

function viewCheckout(){
  const ids = Object.keys(cart);
  if(!ids.length) return viewBasket();
  const mini = ids.map(id=>{
    const p=byId[id], q=cart[id];
    return `<div class="m"><span><img src="${p.img}" alt="">${esc(p.name)} × ${q}</span><span>${money(p.price*q)}</span></div>`;
  }).join("");
  return `<section class="page"><div class="wrap">
    <h1>Checkout</h1>
    <form class="checkout" id="checkoutForm">
      <div>
        <fieldset>
          <legend>Who is this for?</legend>
          <label for="who">Name for the order</label>
          <input type="text" id="who" name="who" autocomplete="off" placeholder="Type a name" maxlength="30">
        </fieldset>
        <fieldset>
          <legend>Delivery</legend>
          <label class="choice"><input type="radio" name="ship" value="Rainbow Van" checked><span><b>Rainbow Van</b><small>Free. Arrives in a flash.</small></span></label>
          <label class="choice"><input type="radio" name="ship" value="Unicorn Express"><span><b>Unicorn Express</b><small>Free. Gallops to your door.</small></span></label>
        </fieldset>
        <fieldset>
          <legend>Payment</legend>
          <label class="choice"><input type="radio" name="pay" value="Squish Coins" checked><span><b>Squish Coins</b><small> Cards needed.</small></span></label>
        </fieldset>
      </div>
      <div>
        <fieldset>
          <legend>Your order</legend>
          <div class="mini">${mini}</div>
          <div class="totalbox" style="box-shadow:none;margin-top:14px">
            <div class="r"><span>Delivery</span><span>Free</span></div>
            <div class="r t"><span>Total</span><span>${money(cartTotal())}</span></div>
          </div>
          <p class="note">Never type real card details into a pretend shop.</p>
        </fieldset>
        <button class="btn block" type="submit">Place order</button>
        <p style="margin-top:16px;text-align:center"><a href="#/basket" style="font-weight:800">Back to basket</a></p>
      </div>
    </form>
  </div></section>`;
}

function viewThanks(){
  if(!lastOrder) return viewShop();
  const o = lastOrder;
  const rows = o.items.map(i=>`<div class="r"><span>${esc(i.name)} × ${i.q}</span><span>${money(i.price*i.q)}</span></div>`).join("");
  const cols = ["#FF5FA2","#FFD84D","#25C2D6","#86E05A","#fff"];
  const conf = Array.from({length:26},(_,i)=>`<i style="left:${(i*3.9+Math.random()*3).toFixed(1)}%;background:${cols[i%cols.length]};animation-delay:${(Math.random()*0.9).toFixed(2)}s"></i>`).join("");
  return `<section class="page thanks"><div class="confetti" aria-hidden="true">${conf}</div>
    <div class="wrap">
      <h1>${o.who ? "Thank you, "+esc(o.who)+"!" : "Thank you!"}</h1>
      <p class="sub" style="font-weight:800;font-size:1.2rem">Your order is on its way with the ${esc(o.ship)}.</p>
      <div class="receipt">
        <h2>Order ${esc(o.number)}</h2>
        ${rows}
        <div class="r"><span>Delivery</span><span>Free</span></div>
        <div class="r t"><span>Total paid</span><span>${money(o.total)}</span></div>
        <div class="r" style="border:0"><span>Paid with</span><span>${esc(o.pay)}</span></div>
      </div>
      <a class="btn" href="#/shop">Shop again</a>
    </div></section>`;
}

/* ---------- Router ---------- */
const app = document.getElementById("app");
function route(){
  const h = (location.hash || "#/").replace(/^#\/?/, "");
  const [page, arg] = h.split("/");
  let html, nav = "", title = "Squishies for you";
  switch(page){
    case "shop": html = viewShop(); nav="shop"; title="Shop | Squishies for you"; break;
    case "item": html = viewItem(arg); nav="shop"; title=(byId[arg]?byId[arg].name:"Shop")+" | Squishies for you"; break;
    case "basket": html = viewBasket(); nav="basket"; title="Basket | Squishies for you"; break;
    case "checkout": html = viewCheckout(); nav="basket"; title="Checkout | Squishies for you"; break;
    case "thanks": html = viewThanks(); title="Thank you | Squishies for you"; break;
    default: html = viewHome(); nav="home";
  }
  app.innerHTML = html;
  document.title = title;
  document.querySelectorAll("[data-nav]").forEach(a=>{
    if(a.dataset.nav===nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  window.scrollTo(0,0);
  app.focus({preventScroll:true});
  updateBadge(false);
}
window.addEventListener("hashchange", route);

/* ---------- Clicks ---------- */
function redraw(){ const y = window.scrollY; route(); window.scrollTo(0,y); }
function squish(el){
  el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
  el.addEventListener("animationend", ()=>el.classList.remove("go"), {once:true});
}
document.addEventListener("click", e=>{
  const t = e.target.closest("button, a");
  if(!t) return;
  if(t.id==="jelly" || t.id==="bigpic"){ squish(t); return; }
  if(t.dataset.open){ location.hash = "#/item/" + t.dataset.open; return; }
  if(t.dataset.add){ addToCart(t.dataset.add); return; }
  if(t.dataset.inc){ cart[t.dataset.inc]++; saveCart(); redraw(); return; }
  if(t.dataset.dec){
    const id = t.dataset.dec; cart[id]--; if(cart[id]<=0) delete cart[id];
    saveCart(); redraw(); return;
  }
  if(t.dataset.remove){ delete cart[t.dataset.remove]; saveCart(); redraw(); return; }
});
document.addEventListener("submit", e=>{
  if(e.target.id!=="checkoutForm") return;
  e.preventDefault();
  const f = new FormData(e.target);
  lastOrder = {
    number: "SQ-" + Math.floor(1000 + Math.random()*9000),
    who: (f.get("who")||"").toString().trim(),
    ship: f.get("ship")||"Rainbow Van",
    pay: f.get("pay")||"Squish Coins",
    items: Object.entries(cart).map(([id,q])=>({name:byId[id].name, price:byId[id].price, q})),
    total: cartTotal()
  };
  cart = {}; saveCart();
  location.hash = "#/thanks";
});
route();
</script>
</body>
</html>
